*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Noto Sans KR",sans-serif;background:#d9d6e8;color:var(--ink);display:flex;justify-content:center}

.cal{padding:12px 10px}

  <div class="toggle2"><button class="on">달력</button><button>목록</button></div></div>
 <div class="glass cal">
  <div class="calhd"><button class="ib" aria-label="이전 달">‹</button><b style="font-size:17px">2026년 10월</b><button class="ib" aria-label="다음 달">›</button></div>
  <div class="wk"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
  <div class="grid num" id="grid"></div>
  <div class="legend">적게<i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i>많이 · 🌱 무지출</div>
 </div>
 <div class="sec"><h2 id="seld">10월 17일 (토)</h2><span class="num e" style="font-weight:700">−52,300원</span></div>
 <div class="list" id="daylist"></div>
</section>

<nav class="glass tab">
 <button class="on" data-s="home" onclick="go('home')"><span>🏠</span>홈</button>
 <button data-s="cal" onclick="go('cal')"><span>📅</span>달력</button>
 <button class="fab" onclick="openSheet()" aria-label="기록하기">+</button>
 <button><span>📊</span>차트</button>
 <button><span>🎯</span>예산</button>
</nav>
<div class="tip" id="tip" role="status" aria-live="polite"><span id="tipt"></span><button onclick="nextTip()" aria-label="팁 닫기">✕</button></div>

<div class="scrim" onclick="closeSheet()"></div>
<div class="sheet" role="dialog" aria-modal="true" aria-label="기록하기">
 <div class="handle"></div>
 <div class="seg"><button class="on">지출</button><button>수입</button></div>
 <div class="amtbox num" id="amt"><span class="ph">0</span><span class="won">원</span></div>
 <div class="hint" id="hint">금액을 입력하세요</div>
 <div class="cats" id="cats"></div>
 <div class="opts"><button class="opt">📅 오늘</button><button class="opt">💳 카드</button><button class="opt">✏️ 메모</button></div>
 <div class="keys num" id="keys"></div>
 <button class="save" id="save" disabled onclick="save()">저장</button>
</div>
<div class="check" id="check"><svg viewBox="0 0 56 56"><path d="M14 29l9 9 19-20"/></svg></div>
<div class="toast" id="toast"><span id="tt"></span><button>되돌리기</button></div>
</div>
<script>
const $=s=>document.querySelector(s), A=$('#app');
const won=n=>n.toLocaleString('ko-KR');
function roll(el,n,suf='원'){el.innerHTML=[...won(n)+suf].map((c,i)=>`<span class="d" style="animation-delay:${i*30}ms">${c}</span>`).join('')}
let today=18400; roll($('#big'),today);
const recent=[['🍚','점심 김치찌개','오늘 · 카드',-9000],['☕','아이스 아메리카노','오늘 · 카드',-4500],['🚌','버스·지하철','어제 · 카드',-2900],['💼','10월 월급','10.10 · 계좌',3100000],['🛒','동네 마트','10.16 · 현금',-23800]];
const row=r=>`<div class="tx"><div class="em" aria-hidden="true">${r[0]}</div><div class="t"><div class="n">${r[1]}</div><div class="m">${r[2]}</div></div><div class="amt num ${r[3]<0?'e':'i'}">${r[3]<0?'−':'+'}${won(Math.abs(r[3]))}</div></div>`;
$('#recent').innerHTML=recent.slice(0,3).map(row).join('');
$('#daylist').innerHTML=[['🍚','가족 외식','카드',-38000],['☕','디저트 카페','카드',-11400],['🚌','택시','카드',-2900]].map(row).join('');
// calendar: Oct 2026 starts Thursday
const sp={1:28000,2:12000,3:0,4:45000,5:8000,6:15400,7:0,8:62000,9:9800,10:21000,11:0,12:5500,13:33000,14:17000,15:7000,16:23800,17:52300,18:2900,19:13500};
let g='';for(let i=0;i<4;i++)g+='<span></span>';
for(let d=1;d<=31;d++){const v=sp[d];let c='dy',s='';
 if(v===undefined){c+=' fut'}else if(v===0){s='🌱'}else{c+=' l'+(v<10000?1:v<25000?2:v<45000?3:4);s=v>=10000?Math.round(v/1000)+'천':won(v)}
 if(d===17)c+=' sel'; if(d===19)c+=' td';
 g+=`<button class="${c}" aria-label="10월 ${d}일${v?' 지출 '+won(v)+'원':v===0?' 무지출':''}">${d}<small>${s}</small></button>`}
$('#grid').innerHTML=g;
const tips=['금액 키패드의 000 버튼, 은근히 편해요.','저장 버튼을 길게 누르면 매달 반복되는 거래로 등록돼요.','하루 동안 한 푼도 안 쓰면 🌱 스티커가 붙어요.','달력에서 날짜를 누르면 그날 쓴 돈만 모아 볼 수 있어요.','밤에는 다크 모드가 눈에 편해요. 오른쪽 위 🌙를 눌러 보세요.'];let ti=0;
function nextTip(){const t=$('#tip');t.style.animation='none';t.offsetHeight;t.style.animation='';$('#tipt').textContent='💡 '+tips[ti++%tips.length]}nextTip();
function go(s){document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('on',e.id===s));document.querySelectorAll('.tab [data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===s));$('#tip').style.display=s==='home'?'':'none'}
function theme(){A.classList.toggle('dark');$('#tbtn').textContent=A.classList.contains('dark')?'☀️':'🌙'}
const cats=[['🍚','식비'],['☕','카페·간식'],['🚌','교통'],['🛒','생활·마트'],['📱','통신·구독'],['👕','쇼핑'],['🎬','문화·여가'],['⋯','더보기']];
$('#cats').innerHTML=cats.map((c,i)=>`<button class="cat" data-i="${i}"><b aria-hidden="true">${c[0]}</b>${c[1]}</button>`).join('');
let amt=0,cat=-1;
$('#cats').onclick=e=>{const b=e.target.closest('.cat');if(!b||b.dataset.i==7)return;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('on'));b.classList.add('on');cat=+b.dataset.i;upd()};
$('#keys').innerHTML=['1','2','3','4','5','6','7','8','9','000','0','⌫'].map(k=>`<button class="key" aria-label="${k==='⌫'?'지우기':k}">${k}</button>`).join('');
$('#keys').onclick=e=>{const k=e.target.closest('.key')?.textContent;if(!k)return;navigator.vibrate?.(8);
 if(k==='⌫')amt=Math.floor(amt/10);else{const n=+(String(amt)+k);if(n<=1e9)amt=n}upd(true)};
function upd(r){const el=$('#amt');if(amt){if(r)roll(el,amt,'');else el.innerHTML=won(amt);el.insertAdjacentHTML('beforeend','<span class="won">원</span>')}else el.innerHTML='<span class="ph">0</span><span class="won">원</span>';
 $('#hint').textContent=!amt?'금액을 입력하세요':cat<0?'카테고리를 골라 주세요':'저장하면 끝!';const s=$('#save');s.disabled=!(amt&&cat>=0);s.classList.toggle('ready',!s.disabled)}
function openSheet(){A.classList.add('open');$('#tip').style.visibility='hidden'}
function closeSheet(){A.classList.remove('open');$('#tip').style.visibility=''}
function save(){const c=cats[cat];$('#check').classList.add('on');
 setTimeout(()=>{$('#check').classList.remove('on');closeSheet();today=Math.max(0,today-amt);roll($('#big'),today);
 recent.unshift([c[0],c[1],'방금 · 카드',-amt]);$('#recent').innerHTML=recent.slice(0,3).map(row).join('');
 $('#tt').textContent=`${c[1]} ${won(amt)}원 기록!`;$('#toast').classList.add('on');setTimeout(()=>$('#toast').classList.remove('on'),3500);
 amt=0;cat=-1;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('on'));upd()},700)}
// URL params for screenshots: ?theme=dark&screen=cal|sheet
const q=new URLSearchParams(location.search);const pal=(q.get('theme')||'a').toLowerCase();if('abcd'.includes(pal)&&pal.length==1){A.classList.remove('p-a');A.classList.add('p-'+pal)}
if(q.get('mode')==='dark'||pal==='dark')theme();
if(q.get('screen')==='cal')go('cal');
if(q.get('screen')==='sheet'){openSheet();amt=12000;cat=0;document.querySelector('.cat').classList.add('on');upd()}
</script></body></html>

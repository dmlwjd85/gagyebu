name: CI
on: { push: { branches: ['**'] }, pull_request: {} }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci
      - run: npm test
      - run: npm run test:rules
      - run: npm run build
      # 알림만(실패로 치지 않음): 이 브랜치의 규칙이 운영에 아직 배포되지 않았으면 머지 전에 규칙부터 배포해야 해요(docs/배포.md)
      - name: 규칙 배포 표시 확인(알림)
        run: node scripts/rules-mark.mjs --check || echo "::warning title=머지 전에 규칙부터 배포해 주세요::이 브랜치의 firestore.rules는 아직 운영에 배포되지 않았어요. npm run rules:deploy → 표시 파일 커밋 → 머지 순서로 해 주세요. 순서를 어기면 앱 배포 워크플로가 멈춰요."

name: Deploy to GitHub Pages
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  # 1단계: 보안 규칙이 먼저(QA 3차 N1). 앱이 규칙보다 먼저 나가면 새 앱의 쓰기가 예전 규칙에 거부돼요.
  #  - 비밀값 FIREBASE_SERVICE_ACCOUNT(서비스 계정 JSON)가 있으면(추천) 여기서 규칙을 직접 배포하고, 성공해야 앱을 빌드·배포해요.
  #    이때는 표시 파일을 보지 않아요. 운영 규칙이 늘 main과 같아져요.
  #  - 없으면(지금) 규칙 배포 표시(.github/firestore-rules-deployed.sha256)가 지금 지문(firestore.rules + firebase.json의 firestore 설정)과 같은지 확인해요.
  #    다르면 이 단계에서 멈추고 앱은 배포하지 않아요(예전 앱이 그대로 남아 안전).
  #    표시 파일은 사람이 남기는 기록이라 실제 배포를 증명하지는 못해요. 그래서 비밀값을 넣는 쪽을 권해요. 절차: docs/배포.md
  #  - (QA 5차 5-2) 이 단계는 main에서만 돌고, 앱 배포와 같은 github-pages 환경 보호(배포 브랜치 제한 등) 뒤에서 돌아요.
  #    다른 브랜치에서 수동 실행하면 rules가 건너뛰어지고, 그 뒤 build·deploy도 돌지 않아요.
  rules:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - id: mode
        env: { SA: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' }
        run: if [ -n "$SA" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; else echo "deploy=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.mode.outputs.deploy == 'true'
        run: npm ci
      - name: 규칙 먼저 배포(서비스 계정이 있을 때)
        if: steps.mode.outputs.deploy == 'true'
        env: { SA: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' }
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx firebase deploy --only firestore:rules --project gagyebu-b44fc2 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
      - name: 규칙 배포 표시 확인(서비스 계정이 없을 때)
        if: steps.mode.outputs.deploy != 'true'
        run: |
          echo "::notice title=규칙 배포 확인 방식::서비스 계정 비밀값이 없어 표시 파일로만 확인해요. 실제 배포 여부는 확인하지 못해요. FIREBASE_SERVICE_ACCOUNT를 넣으면 이 단계가 규칙을 직접 배포해요(docs/배포.md)."
          if ! node scripts/rules-mark.mjs --check; then
            echo "::error title=규칙을 먼저 배포해 주세요::firestore.rules(또는 firebase.json의 firestore 설정)가 운영에 배포된 규칙과 달라요. 'npm run rules:deploy'로 규칙을 배포하고 바뀐 .github/firestore-rules-deployed.sha256을 커밋한 뒤 다시 실행해 주세요(docs/배포.md). 앱은 배포하지 않았어요."
            exit 1
          fi
  build:
    needs: rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build -- --base=/gagyebu/
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy to GitHub Pages
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  # 0단계: 테스트(QA 6차 3). 단위 + 규칙 테스트(에뮬레이터)가 실패하면 규칙도 앱도 배포하지 않아요(rules가 needs: test).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci
      - run: npm test
      - run: npm run test:rules
  # 1단계: 보안 규칙이 앱보다 먼저(QA 3차 N1). 앱이 규칙보다 먼저 나가면 새 앱의 쓰기가 예전 규칙에 거부돼요.
  #  - 지금은 비밀값 FIREBASE_SERVICE_ACCOUNT가 들어가 있어요(권한: Firebase 규칙 관리자 + Service Usage 소비자. 데이터 읽기·쓰기 권한은 없음).
  #    그래서 main에 머지되면 이 단계가 규칙을 직접 배포하고, 성공해야 앱을 빌드·배포해요. 이때 표시 파일은 보지 않아요.
  #  - 표시 파일(.github/firestore-rules-deployed.sha256) 확인은 비밀값이 없을 때의 예비예요.
  #    지문(firestore.rules + firebase.json의 firestore 설정)이 다르면 여기서 멈추고 앱은 배포하지 않아요(예전 앱이 그대로 남아 안전).
  #  - (QA 5차 5-2) 이 단계는 main에서만 돌고, 앱 배포와 같은 github-pages 환경 보호(배포 브랜치 제한 등) 뒤에서 돌아요.
  #    다른 브랜치에서 수동 실행하면 rules가 건너뛰어지고, 그 뒤 build·deploy도 돌지 않아요.
  #  - 순서: test → rules → build → deploy. 테스트가 실패하면 규칙도 나가지 않아요.
  rules:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - id: mode
        env: { SA: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' }
        run: if [ -n "$SA" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; else echo "deploy=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.mode.outputs.deploy == 'true'
        run: npm ci
      - name: 규칙 먼저 배포(서비스 계정이 있을 때)
        if: steps.mode.outputs.deploy == 'true'
        env: { SA: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' }
        run: |
          umask 077
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx firebase deploy --only firestore:rules --project gagyebu-b44fc2 --non-interactive
      # (QA 5차 5-3) 배포가 실패하거나 취소돼도 키 파일을 꼭 지움
      - name: 서비스 계정 키 파일 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
      - name: 규칙 배포 표시 확인(서비스 계정이 없을 때)
        if: steps.mode.outputs.deploy != 'true'
        run: |
          echo "::notice title=규칙 배포 확인 방식::서비스 계정 비밀값이 없어 표시 파일로만 확인해요. 실제 배포 여부는 확인하지 못해요. FIREBASE_SERVICE_ACCOUNT를 넣으면 이 단계가 규칙을 직접 배포해요(docs/배포.md)."
          if ! node scripts/rules-mark.mjs --check; then
            echo "::error title=규칙을 먼저 배포해 주세요::firestore.rules(또는 firebase.json의 firestore 설정)가 운영에 배포된 규칙과 달라요. 'npm run rules:deploy'로 규칙을 배포하고 바뀐 .github/firestore-rules-deployed.sha256을 커밋한 뒤 다시 실행해 주세요(docs/배포.md). 앱은 배포하지 않았어요."
            exit 1
          fi
  build:
    needs: rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      # 테스트는 test 단계에서 이미 통과했어요
      - run: npm run build -- --base=/gagyebu/
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>쓱 가계부 · 10초 기록, 내 돈 날씨</title>
  <meta name="description" content="광고·연동 없는 프라이버시 가계부, 쓱 가계부. 10초 만에 기록하고 오늘 쓸 수 있는 돈을 날씨로 확인하세요." />
  <meta name="theme-color" content="#F6F4FF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0F0E1A" media="(prefers-color-scheme: dark)" />
  <!-- 파비콘: 16·32px PNG(16px는 픽셀 힌팅판) + ico. SVG는 작게 줄이면 힌팅이 사라져 탭용으로 쓰지 않음(design-spec 16-3) -->
  <link rel="icon" href="/favicon.ico" sizes="16x16 24x24 32x32 48x48" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <script>
    // 첫 화면 깜빡임 방지: 렌더 전에 다크 클래스·분위기·글꼴을 정함 (src/lib/theme.js, src/lib/look.js 와 같은 키)
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      var moods = { default: 1, sakura: 1, ocean: 1, maple: 1, snow: 1, retro: 1 };
      var m = localStorage.getItem('mood');
      document.documentElement.dataset.theme = moods[m] ? m : 'default';
      var fonts = { system: 1, pretendard: 1, gaegu: 1 };
      var f = localStorage.getItem('font');
      document.documentElement.dataset.font = fonts[f] ? f : 'pretendard';
      document.documentElement.dataset.decor = localStorage.getItem('decor') === 'off' ? 'off' : 'on';
      var tone = localStorage.getItem('tone');
      var parts = tone == null ? null : tone.split(',');
      var known = parts && parts.some(function (id) { return id === 'menu' || id === 'accent' || id === 'card'; });
      function tonePart(id, fallback) {
        if (tone == null || (tone !== 'none' && !known)) return fallback;
        if (tone === 'none') return 'off';
        return parts.indexOf(id) >= 0 ? 'on' : 'off';
      }
      document.documentElement.dataset.toneMenu = tonePart('menu', 'on');
      document.documentElement.dataset.toneAccent = tonePart('accent', 'on');
      document.documentElement.dataset.toneCard = tonePart('card', 'off');
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"><main class="min-h-dvh flex justify-center px-5 pt-[12vh] pb-10" aria-busy="true"><div class="w-full max-w-sm flex flex-col gap-4">

rrentColor" stroke-width="17.7" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(99.34 2.74) scale(0.4222)"><path d="M22 3 V47 M76 3 V47" fill="none" stroke="currentColor" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 23 H76 M22 47 H76" fill="none" stroke="currentColor" stroke-width="17.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 69 H92" fill="none" stroke="currentColor" stroke-width="17.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M49 69 V97" fill="none" stroke="currentColor" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg></h1>
    <section class="hero-card p-6" id="boot-hero"><p class="text-caption font-semibold" id="boot-cap">☀️ 내 돈 날씨</p><p class="mt-2 text-title">10초 기록,<br />하루 한 번 보는 내 돈 날씨.</p></section>
    <section class="card-solid p-5 flex flex-col gap-3" id="boot-card"><p class="text-body text-ink-sub">여는 중…</p></section></div></main></div>
  <noscript>쓱 가계부는 JavaScript가 필요해요.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>

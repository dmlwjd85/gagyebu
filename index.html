<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>쓱 가계부 · 10초 기록, 내 돈 날씨</title>
  <meta name="description" content="광고·연동 없는 프라이버시 가계부, 쓱 가계부. 10초 만에 기록하고 오늘 쓸 수 있는 돈을 날씨로 확인하세요." />
  <meta name="theme-color" content="#F6F4FF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0F0E1A" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <script>
    // 첫 화면 깜빡임 방지: 렌더 전에 다크 클래스 결정
    try { var t = localStorage.getItem('theme'); if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark'); } catch (e) {}
  </script>
</head>
<body>
  <div id="app"><main class="min-h-dvh flex justify-center px-5 pt-[12vh] pb-10" aria-busy="true"><div class="w-full max-w-sm flex flex-col gap-4">
    <section class="hero-card p-6" id="boot-hero"><p class="text-caption font-semibold" id="boot-cap">☀️ 내 돈 날씨</p><h1 class="mt-2 text-display">쓱 가계부</h1>
      <p class="mt-3 text-body">10초 기록, 하루 한 번 보는 내 돈 날씨.</p></section>
    <section class="card-solid p-5 flex flex-col gap-3" id="boot-card"><p class="text-body text-ink-sub">여는 중…</p></section></div></main></div>
  <noscript>쓱 가계부는 JavaScript가 필요해요.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
